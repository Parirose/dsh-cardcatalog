name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
      - name: Tests
        run: npm test
      - name: Privacy
        run: npm run check:privacy
      - name: Read-only
        run: npm run check:readonly
      - name: Schema
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @deepseek-ai/schemastery@~3.18.5
          npm run check:schema
